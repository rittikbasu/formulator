name: Refresh Circuit Stats

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-circuit-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh circuit stats
        run: npm run refresh:circuit-stats

      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/lib/f1/circuitMetadata.json; then
            echo "No circuit stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/f1/circuitMetadata.json
          git commit -m "chore: refresh circuit stats data"
          git push
